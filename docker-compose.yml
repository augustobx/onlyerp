version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-app
    restart: unless-stopped
    ports:
      # Mapeamos el puerto interno al mismo puerto externo hacia el host (NPM)
      - "3000:3000"
    environment:
      # Variables inyectadas; sobrescriben al .env si es necesario.
      # REGLA ESTRICTA: La URL de conexión apunta al nombre del contenedor (db)
      - DATABASE_URL=mysql://${DB_USER:-tomassiuser}:${DB_PASS:-secret}@db:3306/${DB_NAME:-tomassidb}
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-tomassidb}
      MYSQL_USER: ${DB_USER:-tomassiuser}
      MYSQL_PASSWORD: ${DB_PASS:-secret}
    volumes:
      # Persistencia de los datos de la base de datos
      - db_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
